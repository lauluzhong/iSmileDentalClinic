  <!-- Header logo preload — this is the measured LCP element on the homepage (Lighthouse:
       div.header-left > a.logo-link > picture > img.site-logo-img), not the hero photo.
       It sits inside a JS-rendered header, so the preload scanner never sees it in the HTML
       and it was costing ~1.46s of LCP load delay. Media-scoped to mirror the <picture> art
       direction in Header.jsx (<=1024px gets the tight crop), so exactly ONE logo preload
       fires per viewport and it never competes with the other breakpoint's file. -->

  <link rel="preload" as="image" media="(min-width: 1025px)" href="/logo.webp" type="image/webp" fetchpriority="high">
