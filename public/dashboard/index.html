<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1822">
<title>iSmile · Command Center</title>
<style>
  :root{
    /* ---- iSmile PM-Board light theme (teal palette, Linear/Height style) ---- */
    --teal:#4FB3D1; --teal2:#00A0C6; --teal-deep:#0a6480; --gold:#b8860b;
    --teal-bg:#E8F6FB;
    --bg:#f5f8fa; --bg2:#eef3f6; --panel:#ffffff; --panel2:#f7fafc;
    --line:#e4ebef; --ink:#13242e; --mut:#465863; --mut2:#7c909c;
    --green:#1fab78; --amber:#e07a3f; --violet:#9a6cf0; --pink:#d6479a; --red:#e0524a; --blue:#2b8fd6;
    --shadow:0 1px 2px rgba(19,36,46,.06),0 2px 8px rgba(19,36,46,.05);
    --shadow-h:0 4px 14px rgba(19,36,46,.12),0 1px 3px rgba(19,36,46,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,rgba(0,160,198,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(154,108,240,.05),transparent 55%),var(--bg)}
  a{color:inherit;text-decoration:none}

  #lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:16px}
  .logoimg{width:230px;max-width:62vw;filter:drop-shadow(0 0 26px rgba(79,179,209,.45))}
  #lock .cc-label{font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-top:-2px}
  #lock .sub{color:var(--mut);font-size:13px}
  .pin{display:flex;gap:10px;margin-top:6px}
  .pin .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--teal-deep);transition:.15s}
  .pin .dot.on{background:var(--teal);border-color:var(--teal);box-shadow:0 0 12px var(--teal)}
  .pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px;margin-top:8px}
  .pad button{height:68px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:23px;font-weight:600;cursor:pointer;transition:.12s}
  .pad button:active{background:var(--teal-deep);transform:scale(.94)}
  .pad .blank{background:transparent;border:none;cursor:default}
  #lock .err{color:var(--red);font-size:12.5px;height:16px}

  #app{display:none;min-height:100vh;padding-bottom:80px}
  header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .brandimg{height:24px;width:auto}
  .cc-tag{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);border-left:1px solid var(--line);padding-left:9px}
  .livepill{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);border:1px solid var(--line);padding:4px 10px;border-radius:20px;margin-left:6px}
  .blip{width:8px;height:8px;border-radius:50%;background:var(--mut2)}
  .blip.on{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .clock{margin-left:auto;font-size:12px;color:var(--mut)}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(19,36,46,.04)}
  nav.tabs button{flex:1;background:none;border:none;color:var(--mut2);padding:10px 4px 11px;font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabs button .ic{font-size:18px}
  nav.tabs button.active{color:var(--teal)}

  main{max-width:1200px;margin:0 auto;padding:18px}
  .h{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:6px 0 12px}
  .subt{color:var(--mut);font-size:13px;margin-top:3px;margin-bottom:14px}
  .badge{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:9px;text-transform:uppercase;letter-spacing:.4px}
  .b-live{background:rgba(40,224,160,.16);color:var(--green)}.b-active{background:rgba(255,179,71,.18);color:var(--amber)}
  .b-build{background:rgba(93,180,255,.16);color:var(--blue)}.b-plan{background:rgba(140,166,184,.14);color:var(--mut)}
  .sdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
  .s-live{background:var(--green);box-shadow:0 0 9px var(--green)}
  .s-run{background:var(--amber);box-shadow:0 0 12px var(--amber);animation:pulse 1s infinite}
  .s-build{background:var(--blue)}.s-plan{background:var(--mut2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-size:13px;cursor:pointer;margin-bottom:14px}
  .title{font-size:22px;font-weight:750;letter-spacing:-.3px}

  .chart{overflow-x:auto;padding:8px 0 6px;-webkit-overflow-scrolling:touch}
  .tree{display:inline-block;min-width:100%;padding:6px 20px 10px}
  .tree ul{padding-top:22px;position:relative;display:flex;justify-content:center}
  .tree li{list-style:none;text-align:center;position:relative;padding:22px 7px 0}
  .tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:22px}
  .tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
  .tree li:only-child::after,.tree li:only-child::before{display:none}
  .tree li:only-child{padding-top:0}
  .tree li:first-child::before,.tree li:last-child::after{border:0 none}
  .tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
  .tree li:first-child::after{border-radius:6px 0 0 0}
  .tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);width:0;height:22px}
  .nb{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:128px;max-width:178px;text-align:left;position:relative;transition:.15s}
  .nb .nbt{font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px;line-height:1.25}
  .nb .nbo{font-size:10px;color:var(--mut2);margin-top:4px}
  .nb.ceo{background:linear-gradient(180deg,#E8F6FB,#d6eef6);border-color:var(--teal);min-width:210px}
  .nb.ceo .nbt{color:var(--teal);font-size:13px}
  .nb.dir{background:transparent;border-style:dashed;min-width:0;color:var(--mut)}
  .nb.div{border-color:rgba(230,180,60,.35)}
  .nb.div .nbt{color:var(--gold)}
  .nb.dept{cursor:pointer}
  .nb.dept:hover{border-color:var(--teal);transform:translateY(-2px)}
  .nb.live{border-color:rgba(40,224,160,.5);box-shadow:0 0 0 1px rgba(40,224,160,.2),0 0 20px -6px rgba(40,224,160,.5)}
  .nb.run{border-color:rgba(255,179,71,.6);animation:glowpulse 1.5s infinite}
  @keyframes glowpulse{0%,100%{box-shadow:0 0 16px -7px var(--amber)}50%{box-shadow:0 0 28px -3px var(--amber)}}
  .nb .cnt{font-size:9.5px;color:var(--mut2);margin-top:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px}
  .legend span{display:flex;align-items:center;gap:6px}

  .pipe{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr 24px 1fr;align-items:stretch;margin-top:8px}
  @media(max-width:820px){.pipe{grid-template-columns:1fr}.pipe .ar{display:none}}
  .stage{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px}
  .stage h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--teal);margin-bottom:8px}
  .stage .n{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:7px;font-size:11.5px}
  .stage .n .ag{font-size:8.5px;font-weight:700;color:#04222b;padding:1px 6px;border-radius:7px;display:inline-block;margin-top:4px}
  .ar{display:flex;align-items:center;justify-content:center;color:var(--teal-deep);font-size:20px}

  .wf{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}
  .wf.running{border-color:rgba(255,179,71,.6);box-shadow:0 0 26px -8px var(--amber)}
  .wfh{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .wfh .wav{width:30px;height:30px;border-radius:8px;flex:none;image-rendering:pixelated;background:#0c1c29;border:1px solid var(--line)}
  .wfh .nm{font-weight:650;font-size:14px}
  .wfh .who{font-size:11px;color:var(--mut2)}
  .wfh .rt{margin-left:auto;text-align:right;font-size:10px;color:var(--mut2)}
  .nodes{display:flex;align-items:center;overflow-x:auto;padding-bottom:6px}
  .node{flex:none;min-width:124px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
  .node .nt{font-size:11.5px;font-weight:600}
  .node .nd{font-size:10px;color:var(--mut2);margin-top:3px}
  .node.on{border-color:rgba(255,179,71,.6);box-shadow:0 0 16px -5px var(--amber)}
  .node.gate{border-style:dashed}
  .conn{flex:none;width:26px;height:2px;background:var(--line);position:relative}
  .wf.running .conn{background:linear-gradient(90deg,var(--teal-deep),var(--amber))}
  .conn::after{content:"▸";position:absolute;right:-4px;top:-11px;color:var(--mut2);font-size:13px}

  /* office game */
  .officewrap{display:grid;grid-template-columns:1.7fr 1fr;gap:12px}
  @media(max-width:760px){.officewrap{grid-template-columns:1fr}}
  .stage-c{background:#0a1722;border:1px solid var(--line);border-radius:14px;padding:8px;overflow:hidden}
  #oc{width:100%;height:auto;image-rendering:pixelated;border-radius:8px;display:block}
  .alog{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.65;max-height:340px;overflow:auto;box-shadow:var(--shadow)}
  .alog .ttl{color:var(--teal-deep);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;position:sticky;top:0;background:var(--panel2)}
  .alog .ln .tm{color:var(--teal-deep)}.alog .ln .ok{color:var(--green)}.alog .ln .ai{color:var(--violet)}.alog .ln .run{color:var(--amber)}
  .roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .rchip{display:flex;align-items:center;gap:6px;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
  .rchip.work{border-color:rgba(255,179,71,.55);color:var(--amber)}

  .grp{margin-bottom:18px}
  .grp .gdiv{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);margin-bottom:8px}
  .grp .gdept{font-size:12px;font-weight:600;color:var(--teal);margin:10px 0 7px;display:flex;align-items:center;gap:7px}
  .irow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--panel)}
  .irow .it{font-size:13px;flex:1}
  .irow .it .ino{font-size:11px;color:var(--mut2);margin-top:2px}

  .term{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7;max-height:200px;overflow:auto;margin-top:14px;box-shadow:var(--shadow)}
  .term .tm{color:var(--teal-deep)}.term .ok{color:var(--green)}.term .ai{color:var(--violet)}
  .foot{color:var(--mut2);font-size:11px;margin-top:22px;line-height:1.6}

  /* ============ KANBAN BOARD (Initiatives tab) — ported from iSmile PM-Board ============ */
  :root{
    --kb-planned:#8a98a3; --kb-planned-bg:#eef2f4;
    --kb-blocked:#e07a3f; --kb-blocked-bg:#fdf0e8;
    --kb-active:#00A0C6;  --kb-active-bg:#E8F6FB;
    --kb-review:#9a6cf0;  --kb-review-bg:#f1ecfd;
    --kb-done:#1fab78;    --kb-done-bg:#e8f7f1;
    --kb-line2:#eef3f6; --kb-radius:14px;
  }
  .kb-seg{display:inline-flex;background:var(--kb-line2);border-radius:11px;padding:3px;gap:2px;margin-bottom:14px}
  .kb-seg button{border:none;background:none;font-size:12.5px;font-weight:600;color:var(--mut);padding:7px 15px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
  .kb-seg button.on{background:var(--panel);color:var(--teal-deep);box-shadow:var(--shadow)}
  .kb-seg svg{width:14px;height:14px}
  .kb-kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .kb-kpi{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
  .kb-kpi .n{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1}
  .kb-kpi .l{font-size:11px;color:var(--mut2);margin-top:5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .kb-kpi.blocked .n{color:var(--kb-blocked)} .kb-kpi.active .n{color:var(--kb-active)}
  .kb-kpi.review .n{color:var(--kb-review)} .kb-kpi.done .n{color:var(--kb-done)} .kb-kpi.gate .n{color:var(--teal-deep)} .kb-kpi.planned .n{color:var(--kb-planned)}
  .kb-board{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;align-items:start}
  @media(max-width:1000px){.kb-board{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.kb-board{grid-template-columns:1fr}}
  .kb-col{display:flex;flex-direction:column;gap:11px;min-width:0}
  .kb-colhead{display:flex;align-items:center;gap:9px;padding:4px 4px 2px}
  .kb-colhead .swatch{width:10px;height:10px;border-radius:3px;flex:none}
  .kb-colhead .name{font-size:13px;font-weight:700;letter-spacing:.2px;color:var(--ink)}
  .kb-colhead .count{font-size:11.5px;font-weight:700;color:var(--mut2);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
  .kb-colhead .sub{font-size:10.5px;color:var(--mut2);margin-left:auto;font-weight:500}
  .kb-col.blocked .swatch{background:var(--kb-blocked)} .kb-col.active .swatch{background:var(--kb-active)}
  .kb-col.review .swatch{background:var(--kb-review)} .kb-col.done .swatch{background:var(--kb-done)} .kb-col.planned .swatch{background:var(--kb-planned)}
  .kb-lane{display:flex;flex-direction:column;gap:11px;min-height:40px;padding:3px;border-radius:14px}
  .kb-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--kb-radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;position:relative;overflow:hidden}
  .kb-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:var(--teal)}
  .kb-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mut2)}
  .kb-card.s-blocked::before{background:var(--kb-blocked)} .kb-card.s-active::before{background:var(--kb-active)}
  .kb-card.s-review::before{background:var(--kb-review)} .kb-card.s-done::before{background:var(--kb-done)} .kb-card.s-planned::before{background:var(--kb-planned)}
  .kb-ctop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .kb-cid{font-size:11px;font-weight:800;color:var(--teal2);background:var(--teal-bg);border-radius:6px;padding:1px 7px;letter-spacing:.3px}
  .kb-chip{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px;margin-left:auto}
  .kb-chip.blocked{background:var(--kb-blocked-bg);color:var(--kb-blocked)}
  .kb-chip.active{background:var(--kb-active-bg);color:var(--teal-deep)}
  .kb-chip.review{background:var(--kb-review-bg);color:var(--kb-review)}
  .kb-chip.done{background:var(--kb-done-bg);color:var(--kb-done)}
  .kb-chip.planned{background:var(--kb-planned-bg);color:var(--kb-planned)}
  .kb-ctitle{font-size:14.5px;font-weight:700;line-height:1.3;letter-spacing:-.2px;color:var(--ink)}
  .kb-cmeta{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
  .kb-owner{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);font-weight:600}
  .kb-av{width:19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;flex:none}
  .kb-next{margin-top:11px;background:var(--kb-line2);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.4;color:var(--mut)}
  .kb-next .lbl{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--teal-deep);margin-bottom:3px}
  .kb-next .lbl svg{width:11px;height:11px}
  .kb-flags{display:flex;flex-direction:column;gap:5px;margin-top:9px}
  .kb-flag{display:flex;align-items:flex-start;gap:6px;font-size:11px;line-height:1.35;border-radius:8px;padding:6px 8px}
  .kb-flag svg{width:12px;height:12px;flex:none;margin-top:1px}
  .kb-flag.block{background:var(--kb-blocked-bg);color:#9c4d1f}
  .kb-flag.gate{background:#fdf8ec;color:#8a6d1e}
  .kb-flag.dep{background:#eef3f6;color:var(--mut)}
  .kb-ogroup{margin-bottom:26px}
  .kb-ogroup-head{display:flex;align-items:center;gap:11px;margin:0 2px 13px}
  .kb-ogroup-head .kb-av{width:30px;height:30px;border-radius:9px;font-size:12px}
  .kb-ogroup-head .nm{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
  .kb-ogroup-head .role{font-size:11.5px;color:var(--mut2);font-weight:500}
  .kb-ogroup-head .tally{margin-left:auto;font-size:11px;color:var(--mut2);display:flex;gap:8px;flex-wrap:wrap}
  .kb-ogroup-head .tally span{display:inline-flex;align-items:center;gap:4px}
  .kb-ogroup-head .tdot{width:7px;height:7px;border-radius:50%}
  .kb-ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
  .kb-hidden{display:none!important}
  /* detail modal */
  .kb-overlay{position:fixed;inset:0;z-index:80;background:rgba(19,36,46,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
  .kb-overlay.show{display:flex}
  .kb-modal{background:var(--panel);border-radius:18px;max-width:640px;width:100%;box-shadow:0 24px 60px rgba(19,36,46,.3);animation:kbpop .2s ease;overflow:hidden}
  @keyframes kbpop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .kb-mhead{padding:22px 24px 18px;border-bottom:1px solid var(--line);position:relative}
  .kb-mhead .strip{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kb-mhead .kb-ctop{margin-bottom:10px}
  .kb-mtitle{font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1.2;padding-right:30px;color:var(--ink)}
  .kb-mwhy{font-size:13px;color:var(--mut);line-height:1.5;margin-top:9px}
  .kb-mclose{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:17px;color:var(--mut2);display:flex;align-items:center;justify-content:center}
  .kb-mclose:hover{background:var(--kb-line2);color:var(--ink)}
  .kb-mbody{padding:18px 24px 24px}
  .kb-mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kb-mfact{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .kb-mfact .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut2);font-weight:700;margin-bottom:4px}
  .kb-mfact .v{font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;display:flex;align-items:center;gap:6px}
  .kb-msec{margin-top:18px}
  .kb-msec h4{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--teal-deep);font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:6px}
  .kb-msec h4 svg{width:13px;height:13px}
  .kb-tasklist{display:flex;flex-direction:column;gap:6px}
  .kb-task{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.45;color:var(--mut);padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .kb-task .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--mut2);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px}
  .kb-task.done{color:var(--mut2)}
  .kb-task.done .box{background:var(--kb-done);border-color:var(--kb-done);color:#fff}
  .kb-task.done .txt{text-decoration:line-through;text-decoration-color:var(--mut2)}
  .kb-task.now{border-color:var(--teal);background:var(--teal-bg)}
  .kb-task.now .box{border-color:var(--teal2);border-style:dashed}
  .kb-mnote{font-size:12.5px;line-height:1.6;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
  .kb-mnote b{color:var(--ink)}
  .kb-pillrow{display:flex;flex-wrap:wrap;gap:6px}
  .kb-deppill{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--kb-line2);color:var(--mut);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .kb-deppill:hover{background:var(--teal-bg);color:var(--teal-deep)}
  .kb-legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:11.5px;color:var(--mut2);margin-bottom:14px}
  .kb-legend .it{display:inline-flex;align-items:center;gap:6px}
  .kb-legend .sw{width:10px;height:10px;border-radius:3px}

  /* ---- Strategy board: view toggle (Matrix / Kanban / Month) ---- */
  .iv-seg{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;margin:2px 0 16px}
  .iv-seg button{border:none;background:none;color:var(--mut);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .iv-seg button.on{background:var(--teal);color:#fff;box-shadow:0 1px 4px rgba(0,160,198,.3)}
  .iv-note{font-size:11.5px;color:var(--mut2);margin-bottom:12px;line-height:1.5}

  /* ---- Matrix view ---- */
  .iv-matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .iv-matrix{display:grid;grid-template-columns:104px repeat(6,minmax(158px,1fr));gap:9px;min-width:1080px}
  .iv-head{font-size:11.5px;font-weight:800;color:var(--ink);text-align:center;padding:6px 6px;line-height:1.25;border-bottom:2px solid var(--teal);align-self:end}
  .iv-corner{}
  .iv-rowlab{font-size:11.5px;font-weight:800;color:#fff;border-radius:10px;padding:10px 8px;display:flex;align-items:center;line-height:1.2;text-align:left}
  .iv-rowlab.iv-revenue{background:#1fab78}.iv-rowlab.iv-cost{background:#e07a3f}.iv-rowlab.iv-efficiency{background:#5a78b0}
  .iv-cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:7px;min-height:64px}
  .iv-empty{color:var(--kb-line2);font-size:18px;text-align:center;margin:auto;font-weight:700}
  .iv-card{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--mut2);border-radius:9px;padding:8px 9px;cursor:pointer;transition:.13s;position:relative}
  .iv-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-h);border-color:var(--teal)}
  .iv-card.s-planned{border-left-color:var(--kb-planned)}.iv-card.s-blocked{border-left-color:var(--kb-blocked)}
  .iv-card.s-active{border-left-color:var(--kb-active)}.iv-card.s-review{border-left-color:var(--kb-review)}.iv-card.s-done{border-left-color:var(--kb-done)}
  .iv-ctop{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .iv-cid{font-size:9.5px;font-weight:800;color:var(--teal2)}
  .iv-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .iv-ct{font-size:12px;font-weight:700;line-height:1.25;color:var(--ink)}

  /* ---- Month view ---- */
  .mo-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .mo-grid{display:grid;grid-template-columns:212px repeat(12,minmax(36px,1fr));gap:0;min-width:1000px;font-size:11px}
  .mo-h{text-align:center;font-weight:800;color:var(--mut);padding:6px 0 7px;border-bottom:2px solid var(--teal);position:relative}
  .mo-h .mo-yr{display:block;font-size:8.5px;color:var(--mut2);font-weight:700}
  .mo-h.mo-now{color:var(--teal-deep)}
  .mo-lab{font-size:12px;font-weight:600;color:var(--ink);padding:9px 10px 9px 2px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.2}
  .mo-lab:hover{color:var(--teal-deep)}
  .mo-row{display:contents}
  .mo-cell{border-bottom:1px solid var(--line);border-left:1px dashed var(--kb-line2);min-height:38px;display:flex;align-items:center;justify-content:center}
  .mo-cell.on{position:relative}
  .mo-cell.on::before{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:15px;background:var(--bar);opacity:.85}
  .mo-cell.start.on::before{left:4px;border-radius:8px 0 0 8px}
  .mo-cell.end.on::before{right:4px;border-radius:0 8px 8px 0}
  .mo-cell .ar{position:relative;z-index:1;color:#fff;font-weight:900;font-size:11px}
</style>
</head>

/* Build the workflow list DATA-DRIVEN from the live cron set (status.json jobs).
   Any job in the live feed that has a baked spec uses it; any NEW cron the box gains
   shows up automatically as a generic workflow card (so the list grows itself). */
function liveWorkflows(){
  const baked=MARKETING.workflows, byId={};baked.forEach(w=>byId[w.id]=w);
  const liveIds=Object.keys(JOBSTATE||{});
  if(!liveIds.length) return baked.slice();
  const out=[];
  // keep baked order first (for the jobs that exist live), then append unknown live jobs
  baked.forEach(w=>{ if(byId[w.id]) out.push(w); });
  liveIds.forEach(id=>{
    if(byId[id]) return; // already included
    out.push({id,nm:id.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()),ag:"edith",sch:"cron (see VPS)",nodes:[["Run cron"],["Do work"],["Publish / notify"]]});
  });
  return out;
}

  wanderTimer=setInterval(()=>{
    const idle=actors.filter(o=>o.state==="sit"&&!isRunning(workflowOf(o.id)));
    if(idle.length&&Math.random()<0.6){const o=idle[Math.random()*idle.length|0];const w=waypoints[Math.random()*waypoints.length|0];o.state="walk";o.tx=w.x;o.ty=w.y;o.back=false;}
  },4200);
  function step(){
    ctx.clearRect(0,0,352,276);drawRoom(ctx);
    fc++;
    // monitors glow for working
    for(let i=0;i<ORDER.length;i++){const id=ORDER[i],s=SEATS[i];const w=isRunning(workflowOf(id));
      ctx.fillStyle=w?(fc%30<15?"#ffb347":"#ffd08a"):"#16384a";ctx.fillRect(s.dx+18,s.dy-8,10,7);}
    // actors
    const sorted=actors.slice().sort((p,q)=>p.y-q.y);
    for(const o of sorted){
      const w=isRunning(workflowOf(o.id));
      if(w&&o.state!=="sit"){o.state="walk";o.tx=o.home.x;o.ty=o.home.y;o.back=true;}
      if(o.state==="walk"){
        const dx=o.tx-o.x,dy=o.ty-o.y,d=Math.hypot(dx,dy);
        if(d<1.2){o.x=o.tx;o.y=o.ty;
          if(o.back||(o.tx===o.home.x&&o.ty===o.home.y)){o.state="sit";}
          else{o.state="pause";o.t=fc+90;}
        }else{const sp=0.7;o.x+=dx/d*sp;o.y+=dy/d*sp;o.ft++;if(o.ft%8===0)o.frame^=1;}
      } else if(o.state==="pause"){ if(fc>o.t){o.state="walk";o.tx=o.home.x;o.ty=o.home.y;o.back=true;} o.frame=0;}
      else { o.frame=0; if(w&&fc%24<12)o.frame=2; } // working tiny bob handled via frame? keep sit
      // working glow ring
      if(w){ctx.fillStyle="rgba(255,179,71,.16)";ctx.beginPath();ctx.arc(o.x,o.y-8,12,0,7);ctx.fill();}
      drawPerson(ctx,o.x,o.y,o.a,o.frame,w,1.0);
    }
    if(running)raf=requestAnimationFrame(step);
  }
  step();
  window.__officeStop=function(){running=false;cancelAnimationFrame(raf);clearInterval(wanderTimer);window.__officePaintLog=null;window.__officeSetRoster=null;};
}

function kbCardHTML(it){

  if(it.gate)      flags+=`<div class="kb-flag gate">${KB_ICON.gate}<span>${it.gate}</span></div>`;

    const names=it.deps.map(d=>{const x=kbById(d);return x?`#${x.id} ${x.title.split(/[—(]/)[0].trim()}`:`#${d}`;}).join(" · ");
    if(!it.blockedOn) flags+=`<div class="kb-flag dep">${KB_ICON.dep}<span>Depends on ${names}</span></div>`;
  }
  return `<div class="kb-card s-${s}" data-kbid="${it.id}">
    <div class="kb-ctop"><span class="kb-cid">#${it.id}</span><span class="kb-chip ${s}">${KB_STATUS[s].label.split(" / ")[0]}</span></div>

function kbOpenModal(id){

      </div>
      <div class="kb-msec"><h4>${KB_ICON.next} The one next action</h4><div class="kb-mnote" style="background:var(--teal-bg);border-color:var(--teal)"><b>${it.next}</b></div></div>
      ${it.blockedOn?`<div class="kb-msec"><h4>${KB_ICON.block} Blocked on</h4><div class="kb-mnote" style="background:var(--kb-blocked-bg);border-color:#f3d3bd">${it.blockedOn}</div></div>`:""}

  document.getElementById("kbOverlay").classList.add("show");document.body.style.overflow="hidden";
}
function kbCloseModal(){const o=document.getElementById("kbOverlay");if(o)o.classList.remove("show");document.body.style.overflow="";}
function kbSetView(v){
  KB_VIEW=v;
  document.querySelectorAll("#kbToggle button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-kbview")===v));
  document.getElementById("kbStatusView").classList.toggle("kb-hidden",v!=="status");

/* one-time global wiring for kanban cards + modal */
let KB_WIRED=false;
function kbWire(){
  if(KB_WIRED)return;KB_WIRED=true;
  document.body.addEventListener("click",e=>{
    const card=e.target.closest("[data-kbid]");
    if(card&&!e.target.closest(".kb-overlay")){kbOpenModal(card.getAttribute("data-kbid"));return;}
    const tgl=e.target.closest("#kbToggle button");
    if(tgl){kbSetView(tgl.getAttribute("data-kbview"));return;}
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape")kbCloseModal();});
}
function ensureOverlay(){
  if(document.getElementById("kbOverlay"))return;
  const ov=document.createElement("div");ov.className="kb-overlay";ov.id="kbOverlay";
  ov.innerHTML='<div class="kb-modal" id="kbModal"></div>';
  ov.addEventListener("click",e=>{
    if(e.target.id==="kbOverlay")kbCloseModal();
    const pill=e.target.closest("[data-kbgo]");
    if(pill){const id=pill.getAttribute("data-kbgo");kbCloseModal();setTimeout(()=>kbOpenModal(id),120);}
  });
  document.body.appendChild(ov);
}

function ivMiniCard(it){
  const col=(KB_STATUS[it.status]||{}).color||"#999";
  return `<div class="iv-card s-${it.status}" data-kbid="${it.id}">
    <div class="iv-ctop"><span class="iv-cid">#${it.id}</span><span class="iv-dot" style="background:${col}"></span></div>

function matrixHTML(){
  const cell=(d,l)=>KB_INITIATIVES.filter(i=>(i.dept||"")===d&&(i.lens||"")===l);
  let grid=`<div class="iv-corner" style="min-height:0"></div>`+IV_DEPTS.map(([k,l])=>`<div class="iv-head">${l}</div>`).join("");
  IV_LENSES.forEach(([lk,ll])=>{
    grid+=`<div class="iv-rowlab iv-${lk}">${ll}</div>`;
    IV_DEPTS.forEach(([dk])=>{const items=cell(dk,lk);
      grid+=`<div class="iv-cell">${items.length?items.map(ivMiniCard).join(""):'<div class="iv-empty">·</div>'}</div>`;});
  });
  return `<div class="iv-note">Department (columns) × objective (rows). Empty cells show where there's no initiative yet — a coverage gap, on purpose.</div>
    <div class="iv-matrix-wrap"><div class="iv-matrix">${grid}</div></div>`;

function monthHTML(){
  const base=new Date();base.setDate(1);
  const months=[];for(let i=0;i<12;i++){const d=new Date(base.getFullYear(),base.getMonth()+i,1);
    months.push({key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),lab:d.toLocaleString("en-GB",{month:"short"}),yr:d.getFullYear(),jan:d.getMonth()===0});}
  const idx=k=>months.findIndex(m=>m.key===k);
  const its=KB_INITIATIVES.slice().sort((a,b)=>((a.startMonth||"9999")+String(a.id).padStart(3,"0")).localeCompare((b.startMonth||"9999")+String(b.id).padStart(3,"0")));
  const head=`<div class="mo-lab" style="cursor:default"></div>`+months.map((m,i)=>`<div class="mo-h ${i===0?"mo-now":""}">${m.lab}${(m.jan||i===0)?`<span class="mo-yr">${m.yr}</span>`:""}</div>`).join("");
  const rows=its.map(it=>{
    let s=idx(it.startMonth||"");if(s<0)s=0;
    let e=it.ongoing?11:idx(it.endMonth||it.startMonth||"");if(e<0)e=s;if(e<s)e=s;
    const col=(KB_STATUS[it.status]||{}).color||"#999";
    let cells="";
    for(let i=0;i<12;i++){const on=i>=s&&i<=e;const cls=on?("on"+(i===s?" start":"")+((i===e&&!it.ongoing)?" end":"")):"";
      cells+=`<div class="mo-cell ${cls}" ${on?`style="--bar:${col}"`:""}>${(it.ongoing&&i===11&&on)?'<span class="ar">→</span>':""}</div>`;}
    return `<div class="mo-row"><div class="mo-lab" data-kbid="${it.id}"><span class="iv-cid">#${it.id}</span> ${it.title}</div>${cells}</div>`;
  }).join("");
  return `<div class="iv-note">Rolling 12-month plan — which month each initiative lands in. Bars = active span, → = ongoing/BAU. Conceptual; rebase anytime by editing the store.</div>
    <div class="mo-wrap"><div class="mo-grid">${head}${rows}</div></div>`;
}

/* ---------- live status polling ---------- */
async function poll(){
  try{
    const r=await fetch(STATUS_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;const d=await r.json();
    const prev=RUNNING.slice();
    RUNNING=d.running||[];
    JOBSTATE=d.jobs||{};
    JOBLAST={};Object.keys(d.jobs||{}).forEach(k=>{JOBLAST[k]=d.jobs[k].last;});
    document.getElementById("livecount").textContent=RUNNING.length?RUNNING.length+" working":"standby";
    document.getElementById("blip").className="blip"+(RUNNING.length?" on":"");
    // log changes into office log
    RUNNING.filter(x=>!prev.includes(x)).forEach(x=>{const w=MARKETING.workflows.find(w=>w.id===x);if(window.__officePaintLog){alogLines.unshift({t:new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Kuala_Lumpur",hour:"2-digit",minute:"2-digit"}),m:(w?ag(w.ag).name:x)+" started "+(w?w.nm:x),c:"run"});window.__officePaintLog();}});
    prev.filter(x=>!RUNNING.includes(x)).forEach(x=>{const w=MARKETING.workflows.find(w=>w.id===x);if(window.__officePaintLog){alogLines.unshift({t:new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Kuala_Lumpur",hour:"2-digit",minute:"2-digit"}),m:(w?ag(w.ag).name:x)+" finished",c:"ok"});window.__officePaintLog();}});
    if(window.__officeSetRoster)window.__officeSetRoster();
    const h=location.hash.replace("#","")||"org";
    if(h!=="agents"&&JSON.stringify(prev)!==JSON.stringify(RUNNING))render(); // refresh glow on other views
  }catch(e){}
}

let entered="";
function paintPin(){document.getElementById("pin").innerHTML=Array.from({length:6}).map((_,i)=>`<div class="dot ${i<entered.length?'on':''}"></div>`).join("")}
function key(n){
  if(n==="del"){entered=entered.slice(0,-1);paintPin();return}
  if(entered.length>=6)return;entered+=n;paintPin();
  if(entered.length===6){if(entered===PIN){try{localStorage.setItem("ismile_cc","1")}catch(e){}unlock();}
    else{document.getElementById("err").textContent="Wrong PIN";setTimeout(()=>{entered="";paintPin();document.getElementById("err").textContent=""},700);}}
}
function unlock(){document.getElementById("lock").style.display="none";document.getElementById("app").style.display="block";if(!location.hash)location.hash="org";render();poll();setInterval(poll,20000);fetchRecall();setInterval(fetchRecall,300000);fetchInitiatives();setInterval(fetchInitiatives,300000);fetchActivity();setInterval(fetchActivity,60000);}
async function fetchRecall(){
  try{
    const r=await fetch(RECALL_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;RECALL=await r.json();
    if(location.hash.replace("#","")==="dept/crm")render(); // refresh if currently viewing CRM
  }catch(e){}
}
async function fetchInitiatives(){
  try{
    const r=await fetch(INITIATIVES_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;const d=await r.json();
    if(Array.isArray(d.initiatives)&&d.initiatives.length){KB_INITIATIVES=d.initiatives;}
    if(d.owners&&Object.keys(d.owners).length){KB_OWNERS=d.owners;}
    if(location.hash.replace("#","")==="initiatives")render(); // refresh board if viewing it
  }catch(e){}
}
async function fetchActivity(){
  try{
    const r=await fetch(ACTIVITY_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;const d=await r.json();
    if(Array.isArray(d.entries))ACTIVITY=d.entries;
    if(window.__officePaintLog)window.__officePaintLog(); // refresh the office activity panel
  }catch(e){}
}
function buildPad(){const pad=document.getElementById("pad");["1","2","3","4","5","6","7","8","9","blank","0","del"].forEach(k=>{const b=document.createElement("button");if(k==="blank"){b.className="blank";b.disabled=true}else if(k==="del"){b.textContent="⌫";b.onclick=()=>key("del")}else{b.textContent=k;b.onclick=()=>key(k)}pad.appendChild(b)});paintPin();}
